[package]
name = "the-pane"
version = "0.1.0"
description = "A new home for Windows."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Devices_Display",
    "Win32_System_Power",
    "Win32_System_Shutdown",
] }
# Already used by Tauri itself; needed here for COM (volume, brightness).
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
] }
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
